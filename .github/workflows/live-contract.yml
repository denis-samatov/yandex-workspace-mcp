name: Live Yandex contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

jobs:
  live:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
      YANDEX_WIKI_ORG_ID: ${{ secrets.YANDEX_WIKI_ORG_ID }}
      WIKI_ALLOWED_ROOTS: live-contract-${{ github.run_id }}
      DISK_ALLOWED_ROOTS: /live-contract-${{ github.run_id }}
      MCP_CURSOR_KEYS: ${{ secrets.MCP_CURSOR_KEYS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Require live credentials
        shell: bash
        run: |
          test -n "$YANDEX_OAUTH_TOKEN"
          test -n "$YANDEX_WIKI_ORG_ID"
          test -n "$MCP_CURSOR_KEYS"
      - run: uv sync --locked --dev
      - name: Run scratch-only contract sweep
        run: >-
          uv run python scripts/contract_sweep.py
          --acknowledge-live
          --wiki-scratch-root "live-contract-${{ github.run_id }}"
          --disk-scratch-root "/live-contract-${{ github.run_id }}"
          --report "$RUNNER_TEMP/contract-sweep-report.json"
      - name: Verify unconditional cleanup status
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/contract-sweep-report.json"
          jq -e '.cleanup_ok == true' "$RUNNER_TEMP/contract-sweep-report.json"
