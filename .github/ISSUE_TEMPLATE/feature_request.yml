name: Feature request
description: Propose a scoped capability or integration improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Permission and security impact
      description: Describe reads, writes, deletion, credentials, allowlists, and audit requirements.
    validations:
      required: true
