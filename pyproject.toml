[project]
name = "yandex-workspace-mcp"
version = "0.1.0"
description = "MCP server for Yandex Disk and Yandex Wiki integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "pydantic-settings>=2.7.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
]

[project.scripts]
yandex-workspace-mcp = "yandex_workspace_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest-asyncio>=0.25.0",
    "pytest>=8.3.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
